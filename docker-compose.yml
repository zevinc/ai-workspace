services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-pgvector
    environment:
      POSTGRES_DB: ai_knowledge
      POSTGRES_USER: ai_knowledge
      POSTGRES_PASSWORD: ai_knowledge
    ports:
      - "5432:5432"
    volumes:
      - ai_pg_data:/var/lib/postgresql/data

volumes:
  ai_pg_data: